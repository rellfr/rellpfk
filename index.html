<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pakto Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="quiz-container">

    <h1>PAKTO QUIZ</h1>

    <section class="time-section">

        <h3>Wybierz długość fragmentu:</h3>

        <div class="time-buttons">

            <button class="time-button" data-time="1">
                1 sekunda
            </button>

            <button class="time-button active" data-time="5">
                5 sekund
            </button>

            <button class="time-button" data-time="10">
                10 sekund
            </button>

        </div>

    </section>


    <section id="quiz">

        <p id="songNumber">
            Piosenka 1 / 16
        </p>

        <h2 id="question">
            Jaki jest tytuł piosenki?
        </h2>


        <audio id="audio" preload="auto"></audio>


        <button id="playButton" class="main-button">
            ▶ ODTWÓRZ FRAGMENT
        </button>


        <input
            type="text"
            id="answer"
            placeholder="Wpisz tytuł piosenki..."
            autocomplete="off"
            spellcheck="false"
        >


        <button id="submitAnswer" class="main-button">
            SPRAWDŹ ODPOWIEDŹ
        </button>


        <p id="result"></p>


        <div class="navigation">

            <button id="previousButton">
                ◀ WRÓĆ
            </button>

            <button id="nextButton">
                KOLEJNA PIOSENKA ▶
            </button>

        </div>


        <p id="score">
            Poprawne odpowiedzi: 0
        </p>

    </section>

</main>


<script src="script.js"></script>

</body>
</html>
