<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pakto Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="quiz-container">

        <h1>PAKTO QUIZ</h1>

        <!-- WYBÓR CZASU -->

        <section class="time-section">

            <h3>Wybierz długość fragmentu:</h3>

            <div class="time-buttons">

                <button
                    class="time-button"
                    data-time="1"
                >
                    1 sekunda
                </button>

                <button
                    class="time-button active"
                    data-time="5"
                >
                    5 sekund
                </button>

                <button
                    class="time-button"
                    data-time="10"
                >
                    10 sekund
                </button>

            </div>

        </section>


        <!-- QUIZ -->

        <section id="quiz">

            <p id="songNumber">
                Piosenka 1 / 16
            </p>

            <h2 id="question">
                Jaki jest tytuł piosenki?
            </h2>


            <!-- AUDIO -->

            <audio
                id="audio"
                preload="auto"
            ></audio>


            <button
                id="playButton"
                class="main-button"
                type="button"
            >
                ▶ ODTWÓRZ FRAGMENT
            </button>


            <!-- ODPOWIEDŹ -->

            <input
                type="text"
                id="answer"
                placeholder="Wpisz tytuł piosenki..."
                autocomplete="off"
                spellcheck="false"
            >


            <button
                id="submitAnswer"
                class="main-button"
                type="button"
            >
                SPRAWDŹ ODPOWIEDŹ
            </button>


            <!-- WYNIK ODPOWIEDZI -->

            <p id="result"></p>


            <!-- NAWIGACJA -->

            <div class="navigation">

                <button
                    id="previousButton"
                    type="button"
                >
                    ◀ WRÓĆ
                </button>

                <button
                    id="nextButton"
                    type="button"
                >
                    KOLEJNA PIOSENKA ▶
                </button>

            </div>


            <!-- PUNKTY -->

            <p id="score">
                Poprawne odpowiedzi: 0
            </p>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
